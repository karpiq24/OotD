<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Odyseja Smoczych Lordów: a Dragonlord's crested Corinthian helmet in profile, a
       verdigris dragon wing at its temple and an ember in the eye, on a black-glaze shield -->
  <defs>
    <radialGradient id="shield" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#2f3d38"/>
      <stop offset="1" stop-color="#0b100e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe2a8"/>
      <stop offset=".45" stop-color="#c88d44"/>
      <stop offset=".55" stop-color="#6e4317"/>
      <stop offset="1" stop-color="#d9a254"/>
    </linearGradient>
    <linearGradient id="bronze" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fde7b4"/>
      <stop offset=".35" stop-color="#dba55a"/>
      <stop offset=".72" stop-color="#9a6428"/>
      <stop offset="1" stop-color="#5a3410"/>
    </linearGradient>
    <linearGradient id="wing" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2d6a5f"/>
      <stop offset="1" stop-color="#8fe0cb"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f27a52"/>
      <stop offset=".6" stop-color="#b8341c"/>
      <stop offset="1" stop-color="#6e180b"/>
    </linearGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset=".45" stop-color="#ffb040"/>
      <stop offset="1" stop-color="#ff5a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#shield)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- horsehair crest sweeping front to back, its tail breaking the rim -->
  <path d="M47 15.5 C44.5 7 36 3 27 4.5 C17.5 6 10 12.5 4 22 C10.5 18.5 15.5 17 20.5 17
           C27 14 37 13 47 15.5 Z"
        fill="url(#crest)" stroke="#2a0d05" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M43 12 C37 8.5 28 8.5 20 12.5 M38 8 C31 6.8 23 9 16 14.5" fill="none" stroke="#2a0d05" stroke-width=".6" opacity=".5"/>

  <!-- helmet in profile, facing right: dome, brow, eye notch, cheek guard, flared neck guard -->
  <path fill="url(#bronze)" stroke="#2a1a0c" stroke-width="1.1" stroke-linejoin="round"
        d="M16.6 49.5 C14.8 41 15.6 30 19.6 23 C23.6 16.4 30.4 13.2 37.6 13.6
           C44.8 14 49.4 19.4 49.8 27 L49.8 31.6 L43.2 31.6
           C41.2 31.6 40.4 33.6 41.4 35.2 L50.4 41.4 L46.6 53
           C43 51.8 40 49.2 37.6 45.8 C36.6 44.2 35 42.6 33.4 42.9
           C30 43.6 27 46.6 24 50.2 C21 53.2 17.4 53.8 14.6 52.8 C14.7 51.6 15.4 50.5 16.6 49.5 Z"/>
  <!-- eye socket with an ember -->
  <path d="M49.8 31.6 L43.2 31.6 C41.2 31.6 40.4 33.6 41.4 35.2 L44.6 37.4 C46.6 36.2 48.6 34.4 49.8 31.6 Z"
        fill="#0b100e"/>
  <circle cx="44.6" cy="33.6" r="2.3" fill="url(#ember)"/>
  <!-- cheek-guard edge, brow band and dome highlight -->
  <path d="M38.6 36.4 C40.4 40.6 42 45.6 42.6 50.6" fill="none" stroke="#5a3410" stroke-width=".9" opacity=".7"/>
  <path d="M20.5 30 C28 27.4 38 26.6 49.6 28" fill="none" stroke="#5a3410" stroke-width="1" opacity=".6"/>
  <path d="M24.5 21 C28 17.4 33 15.8 38 16.2" fill="none" stroke="#fff3cf" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>

  <!-- verdigris dragon wing at the temple, three fingers sweeping back -->
  <path d="M31 31 C25 25 15 21.5 3.5 23 C7 25 9 27.5 9.8 30 C12.8 29.2 15.4 29.6 17.4 30.8
           C16.8 33 17.4 35 18.8 36.4 C21.2 35.4 23.6 35.4 25.6 36.4 C26.4 34.4 28.4 32.4 31 31 Z"
        fill="url(#wing)" stroke="#081210" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M30.5 31.2 L5.5 23.6 M30.5 31.2 L10.8 29.6 M30.5 31.2 L18.2 32.8" stroke="#081210" stroke-width=".65" stroke-linecap="round" opacity=".65"/>
</svg>
